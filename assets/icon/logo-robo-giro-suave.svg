<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Logo animada de robô com giro suave</title>
  <desc id="logoDesc">Balão de conversa em forma de robô. A cabeça completa um giro, desacelera gradualmente, se acomoda e os olhos piscam.</desc>

  <style>
    :root {
      --blue: #168dff;
      --indigo: #4c5cff;
      --purple: #b425ff;
      --face: #314fc7;
      --face-outline: #172c8e;
      --glow: #526cff;
    }

    .stop-blue { stop-color: var(--blue); }
    .stop-indigo { stop-color: var(--indigo); }
    .stop-purple { stop-color: var(--purple); }
    .eye-fill { fill: var(--face); }
    .eye-stroke { stroke: var(--face-outline); }
    .mouth-fill { stroke: var(--face); }
    .glow-color { flood-color: var(--glow); }

    @media (prefers-color-scheme: dark) {
      :root {
        --blue: #31a8ff;
        --indigo: #7380ff;
        --purple: #d057ff;
        --face: #8aa0ff;
        --face-outline: #4059d7;
        --glow: #8b96ff;
      }
    }

    svg[data-theme="light"] {
      --blue: #168dff;
      --indigo: #4c5cff;
      --purple: #b425ff;
      --face: #314fc7;
      --face-outline: #172c8e;
      --glow: #526cff;
    }

    svg[data-theme="dark"] {
      --blue: #31a8ff;
      --indigo: #7380ff;
      --purple: #d057ff;
      --face: #8aa0ff;
      --face-outline: #4059d7;
      --glow: #8b96ff;
    }

    .head {
      transform-box: view-box;
      transform-origin: 256px 278px;
      animation: headSpin 8s linear infinite;
      will-change: transform;
    }

    .eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.4s ease-in-out infinite;
    }

    /*
      O espaçamento crescente entre os ângulos produz a desaceleração:
      o giro começa rápido, perde velocidade e termina com uma acomodação curta.
    */
    @keyframes headSpin {
      0%   { transform: rotate(0deg) translateY(0); }
      10%  { transform: rotate(132deg) translateY(-3px); }
      20%  { transform: rotate(228deg) translateY(1px); }
      30%  { transform: rotate(292deg) translateY(-2px); }
      40%  { transform: rotate(331deg) translateY(0); }
      49%  { transform: rotate(351deg) translateY(-1px); }
      57%  { transform: rotate(361.8deg) translateY(0); }
      64%  { transform: rotate(357.8deg) translateY(0); }
      70%  { transform: rotate(360.8deg) translateY(0); }
      76%,
      100% { transform: rotate(360deg) translateY(0); }
    }

    @keyframes blink {
      0%, 40%, 44%, 48%, 100% { transform: scaleY(1); }
      42%, 46%                 { transform: scaleY(0.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .head,
      .eyes {
        animation: none;
      }
    }
  </style>

  <defs>
    <linearGradient id="bodyGradient" x1="75" y1="155" x2="445" y2="390" gradientUnits="userSpaceOnUse">
      <stop class="stop-blue" offset="0"/>
      <stop class="stop-indigo" offset="0.5"/>
      <stop class="stop-purple" offset="1"/>
    </linearGradient>

    <linearGradient id="antennaGradient" x1="215" y1="36" x2="297" y2="140" gradientUnits="userSpaceOnUse">
      <stop class="stop-indigo" offset="0"/>
      <stop class="stop-blue" offset="1"/>
    </linearGradient>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood class="glow-color" flood-opacity="0.22"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="bubbleCutout" maskUnits="userSpaceOnUse" x="55" y="112" width="410" height="370">
      <rect x="0" y="0" width="512" height="512" fill="black"/>
      <rect x="62" y="118" width="388" height="292" rx="140" fill="white"/>
      <path d="M139 353V465a13 13 0 0 0 20 11l123-78Z" fill="white"/>
      <rect x="112" y="170" width="288" height="190" rx="92" fill="black"/>
      <path d="M178 335v65l79-51Z" fill="black"/>
    </mask>
  </defs>

  <g class="head">
    <g filter="url(#softGlow)">
      <path d="M238 132V91h36v41Z" fill="url(#antennaGradient)"/>
      <circle cx="256" cy="68" r="38" fill="url(#antennaGradient)"/>

      <rect x="55" y="112" width="410" height="370"
            fill="url(#bodyGradient)" mask="url(#bubbleCutout)"/>
    </g>

    <g class="face">
      <g class="eyes">
        <circle class="eye-fill eye-stroke" cx="183" cy="260" r="25" stroke-width="5"/>
        <circle class="eye-fill eye-stroke" cx="329" cy="260" r="25" stroke-width="5"/>
        <circle cx="175" cy="252" r="6" fill="#ffffff" opacity="0.16"/>
        <circle cx="321" cy="252" r="6" fill="#ffffff" opacity="0.16"/>
      </g>

      <path d="M224 305c18 21 46 21 64 0"
            fill="none"
            class="eye-stroke"
            stroke-width="17"
            stroke-linecap="round"/>
      <path d="M224 301c18 21 46 21 64 0"
            fill="none"
            class="mouth-fill"
            stroke-width="11"
            stroke-linecap="round"/>
    </g>
  </g>
</svg>

name: Sync README with code changes

on:
  workflow_run:
    workflows:
      - "Tests"
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update-readme:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Update README with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            COMMIT: ${{ github.event.workflow_run.head_sha }}

            Run `git diff HEAD~1 HEAD` to see what this push to main changed.

            If the change affects anything documented in README.md or
            README.pt-BR.md (features, setup/install steps, environment
            variables, project structure, available commands, dependencies,
            etc.):

            1. Update README.md accordingly.
            2. Apply the equivalent update to README.pt-BR.md, keeping it in
               Portuguese (pt-BR) and consistent with README.md.
            3. Configure git identity:
               git config user.name "github-actions[bot]"
               git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            4. Create a new branch named `readme-sync/<short-sha>`, commit the
               changes with message "docs: sync README with latest changes",
               push it, and open a pull request against `main` with
               `gh pr create` including a short summary of what changed and
               why.

            If nothing in the READMEs needs to change, do not create a
            branch, commit, or PR — just stop.

            Never push directly to main.

          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh:*)"
            --max-turns 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
